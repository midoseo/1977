<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>에스원 50주년 · 기록보관소 잠금해제 미션</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
:root{
  --void:#080B14; --void-2:#0C1220; --panel:#111A2E; --panel-2:#182238;
  --line:#243450; --s1:#2E8FE6; --scan:#54D2FF; --gold:#E9B949; --gold-soft:#F4D588;
  --ink:#EAF1FF; --muted:#8397BC; --danger:#E5533C; --ok:#3FD08A;
  --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans:'Pretendard', system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{ font-family:var(--sans);
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(46,143,230,.10), transparent 60%),
    radial-gradient(900px 500px at 90% 110%, rgba(233,185,73,.06), transparent 60%), var(--void);
  color:var(--ink); min-height:100dvh; display:flex; align-items:center; justify-content:center;
  padding:20px; overflow-x:hidden; -webkit-font-smoothing:antialiased; }
body::after{ content:""; position:fixed; inset:0; pointer-events:none; z-index:9999;
  background:repeating-linear-gradient(0deg, rgba(84,210,255,.035) 0 1px, transparent 1px 3px);
  mix-blend-mode:screen; opacity:.5; }
#app{ width:100%; max-width:560px; }
.console{ background:linear-gradient(180deg, var(--panel), var(--void-2)); border:1px solid var(--line);
  border-radius:20px; box-shadow:0 30px 80px -30px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.04);
  overflow:hidden; position:relative; }
.console::before{ content:""; position:absolute; top:0; left:24px; right:24px; height:1px;
  background:linear-gradient(90deg, transparent, var(--scan), transparent); opacity:.5; }
.pad{ padding:28px 26px }
.eyebrow{ font-family:var(--mono); font-size:11px; letter-spacing:.28em; text-transform:uppercase;
  color:var(--s1); display:flex; align-items:center; gap:8px; }
.eyebrow.center{ justify-content:center } .eyebrow.gold{ color:var(--gold) }
.eyebrow .dot{ width:6px; height:6px; border-radius:50%; background:var(--scan); box-shadow:0 0 10px var(--scan); animation:blink 1.6s infinite }
.eyebrow.gold .dot{ background:var(--gold); box-shadow:0 0 10px var(--gold) }
@keyframes blink{ 0%,100%{opacity:1} 50%{opacity:.25} }
h1{ font-size:26px; line-height:1.25; letter-spacing:-.02em; margin:14px 0 8px; font-weight:800 }
.lead{ color:var(--muted); font-size:14.5px; line-height:1.7 }
.mono{ font-family:var(--mono) }
.btn{ font-family:var(--sans); font-weight:700; font-size:15px; width:100%; padding:15px 18px;
  border-radius:13px; border:1px solid transparent; cursor:pointer;
  transition:transform .12s ease, box-shadow .2s ease, background .2s; display:flex; align-items:center; justify-content:center; gap:9px; }
.btn-primary{ background:linear-gradient(180deg,#3A9BEE,#1E76C8); color:#fff; box-shadow:0 10px 24px -8px rgba(46,143,230,.7) }
.btn-primary:hover{ transform:translateY(-1px) }
.btn-gold{ background:linear-gradient(180deg,#F0C860,#D9A22E); color:#2A1E00; box-shadow:0 10px 24px -8px rgba(233,185,73,.6) }
.btn-gold:hover{ transform:translateY(-1px) }
.btn-ghost{ background:var(--panel-2); color:var(--ink); border-color:var(--line) }
.btn-ghost:hover{ border-color:var(--s1) }
.btn:disabled{ opacity:.5; cursor:not-allowed; transform:none }
label.field{ display:block; margin-top:18px }
label.field .cap{ font-family:var(--mono); font-size:11px; letter-spacing:.18em; color:var(--muted); text-transform:uppercase }
.input{ margin-top:8px; width:100%; padding:14px 15px; border-radius:12px; background:var(--void-2);
  border:1px solid var(--line); color:var(--ink); font-size:15px; font-family:var(--sans); transition:border .18s, box-shadow .18s; }
.input:focus{ outline:none; border-color:var(--s1); box-shadow:0 0 0 3px rgba(46,143,230,.18) }
.input::placeholder{ color:#4A5D82 }
.input.area{ min-height:104px; resize:vertical; line-height:1.65 }
.counter{ text-align:right; font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:6px }
#boot{ font-family:var(--mono); font-size:13.5px; line-height:2; color:var(--scan); min-height:220px; padding:30px 26px }
#boot .b-line{ opacity:0 } #boot .b-line.on{ opacity:1 } #boot .ok{ color:var(--ok) } #boot .warn{ color:var(--gold) }
.feed{ display:flex; flex-direction:column; gap:12px; margin-top:16px; min-height:190px; max-height:56vh; overflow-y:auto; padding-right:4px }
.comms{ border-radius:12px; padding:12px 14px; border:1px solid var(--line); background:var(--void-2); animation:fade .3s both }
.comms.blue{ border-color:rgba(46,143,230,.42); background:linear-gradient(180deg, rgba(46,143,230,.10), rgba(46,143,230,.02)); }
.comms.sys{ border-style:dashed }
.comms .who{ font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; color:var(--s1); margin-bottom:6px; display:flex; align-items:center; gap:6px }
.comms.sys .who{ color:var(--muted) }
.comms .msg{ font-size:14.5px; line-height:1.72; color:var(--ink); white-space:pre-wrap }
.comms .msg.typing::after{ content:"▮"; color:var(--scan); margin-left:1px; animation:blink 1s steps(1) infinite }
.hud{ display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--line); background:rgba(8,11,20,.6) }
.hud .agent{ font-family:var(--mono); font-size:11.5px; color:var(--muted); letter-spacing:.04em }
.hud .agent b{ color:var(--ink); font-weight:600 }
.hud .right{ display:flex; align-items:center; gap:10px }
.hud .lv{ font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--danger); border:1px solid var(--danger);
  border-radius:6px; padding:2px 6px; text-transform:uppercase }
.hud .timer{ font-family:var(--mono); font-size:15px; font-weight:600; color:var(--scan); letter-spacing:.06em }
.actbar{ display:flex; justify-content:flex-end; padding:8px 20px 0 }
.actbar .act{ font-family:var(--mono); font-size:10px; letter-spacing:.16em; color:var(--gold); text-transform:uppercase }
.progress{ display:flex; gap:7px; padding:10px 20px 4px }
.progress .p{ flex:1; height:4px; border-radius:3px; background:var(--panel-2); overflow:hidden }
.progress .p.done{ background:var(--gold); box-shadow:0 0 12px -2px var(--gold) }
.progress .p.cur{ background:linear-gradient(90deg,var(--s1),var(--scan)) }
.progress.future .p.done{ background:var(--s1); box-shadow:0 0 12px -2px var(--s1) }
.qimg{ width:100%; border-radius:12px; border:1px solid var(--line); margin:12px 0 2px; display:block; background:#F4F7FC }
.record img{ width:100%; border-radius:10px; border:1px solid var(--line); margin-top:10px; display:block }
.qimg-cap{ font-family:var(--mono); font-size:10px; color:var(--muted); text-align:center; margin-top:5px; letter-spacing:.04em }
.zone-tag{ font-family:var(--mono); font-size:11px; letter-spacing:.2em; color:var(--gold); text-transform:uppercase; margin-bottom:10px }
.zone-tag.future{ color:var(--scan) }
/* 제한시간 바 */
.qtimer{ display:flex; align-items:center; gap:10px; margin:4px 0 2px }
.qtimer .track{ flex:1; height:6px; border-radius:4px; background:var(--panel-2); overflow:hidden }
.qtimer .bar{ height:100%; width:100%; background:var(--ok); border-radius:4px; transition:width .1s linear, background .3s }
.qtimer .sec{ font-family:var(--mono); font-size:12px; font-weight:600; color:var(--muted); min-width:32px; text-align:right }
.q{ font-size:19px; font-weight:700; line-height:1.5; letter-spacing:-.01em; margin:14px 0 6px }
.opts{ display:grid; gap:10px; margin-top:14px; transition:opacity .3s }
.opts.pending{ opacity:.2; pointer-events:none }
.opt{ text-align:left; padding:15px 16px; border-radius:12px; cursor:pointer; background:var(--panel-2);
  border:1px solid var(--line); color:var(--ink); font-size:15px; font-family:var(--sans);
  display:flex; align-items:center; gap:12px; transition:border .15s, background .15s, transform .1s; }
.opt:hover{ border-color:var(--s1) } .opt:active{ transform:scale(.99) }
.opt .key{ font-family:var(--mono); font-size:12px; color:var(--s1); border:1px solid var(--line);
  width:24px; height:24px; border-radius:6px; display:grid; place-items:center; flex:0 0 auto }
.opt.correct{ border-color:var(--ok); background:rgba(63,208,138,.12) } .opt.correct .key{ color:var(--ok); border-color:var(--ok) }
.opt.wrong{ border-color:var(--danger); background:rgba(229,83,60,.12) } .opt.wrong .key{ color:var(--danger); border-color:var(--danger) }
.opt:disabled{ cursor:default }
.feedback{ margin-top:16px; font-size:13.5px; line-height:1.7; min-height:20px }
.feedback .deny{ color:var(--danger); font-family:var(--mono); font-weight:600 }
.feedback .hint{ color:var(--muted); display:block; margin-top:4px }
.record{ margin-top:14px; background:var(--void-2); border:1px solid var(--line); border-radius:12px; padding:14px 15px }
.record .rlabel{ font-family:var(--mono); font-size:10.5px; letter-spacing:.2em; color:var(--gold); text-transform:uppercase }
.record .rtext{ font-size:13.5px; line-height:1.7; color:var(--ink); margin-top:6px }
/* 봉인강화 경보 */
.alarm{ position:absolute; left:0; right:0; top:0; z-index:5; background:linear-gradient(180deg, rgba(229,83,60,.95), rgba(229,83,60,0));
  color:#fff; font-family:var(--mono); font-size:12px; letter-spacing:.1em; text-align:center; padding:12px 10px 22px; animation:drop 2.2s ease forwards }
@keyframes drop{ 0%{transform:translateY(-100%)} 15%{transform:translateY(0)} 80%{transform:translateY(0)} 100%{transform:translateY(-100%)} }
.codebar{ padding:18px 20px 22px; border-top:1px solid var(--line); background:rgba(8,11,20,.55) }
.codebar .clabel{ font-family:var(--mono); font-size:10.5px; letter-spacing:.22em; color:var(--muted); text-transform:uppercase; display:flex; justify-content:space-between; margin-bottom:10px }
.slots{ display:flex; gap:9px; justify-content:center }
.slot{ flex:1; max-width:56px; aspect-ratio:3/4; border-radius:10px; background:var(--void); border:1px solid var(--line);
  display:grid; place-items:center; font-family:var(--mono); font-weight:800; font-size:26px; color:#33456b; transition:all .3s }
.slot.filled{ color:var(--gold); border-color:var(--gold);
  background:linear-gradient(180deg, rgba(233,185,73,.14), rgba(233,185,73,.03));
  box-shadow:0 0 20px -4px rgba(233,185,73,.55), inset 0 0 12px -6px var(--gold); animation:lockin .5s cubic-bezier(.2,1.4,.4,1) }
@keyframes lockin{ 0%{transform:translateY(-8px) scale(.7); opacity:0} 60%{transform:translateY(2px) scale(1.08)} 100%{transform:none; opacity:1} }
.reveal{ text-align:center; padding:34px 26px 30px }
.badge50{ font-family:var(--mono); font-weight:800; font-size:60px; letter-spacing:-.03em;
  background:linear-gradient(180deg,var(--gold-soft),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; line-height:1; margin-bottom:6px }
/* 등급 뱃지 */
.grade{ display:flex; align-items:center; gap:16px; margin:18px 0 4px; padding:16px; border:1px solid var(--line); border-radius:16px; background:var(--void-2); text-align:left }
.grade .g{ font-family:var(--mono); font-weight:800; font-size:34px; width:64px; height:64px; flex:0 0 auto; border-radius:14px; display:grid; place-items:center; color:#2A1E00 }
.grade .g.S{ background:linear-gradient(180deg,#F4D588,#E9B949) } .grade .g.A{ background:linear-gradient(180deg,#6FD0FF,#2E8FE6); color:#04233d }
.grade .g.B{ background:linear-gradient(180deg,#9fb0cf,#5b6f92); color:#0c1220 } .grade .g.C{ background:linear-gradient(180deg,#E58A6F,#E5533C); color:#2a0a02 }
.grade .gt{ font-weight:800; font-size:17px; line-height:1.3 }
.grade .gs{ color:var(--muted); font-size:13px; margin-top:4px; line-height:1.5 }
.cert{ margin:18px 0 6px; border:1px solid var(--gold); border-radius:16px; overflow:hidden; background:linear-gradient(180deg, rgba(233,185,73,.08), var(--void-2)) }
.cert .chead{ background:linear-gradient(90deg, rgba(233,185,73,.16), transparent); padding:12px 16px; font-family:var(--mono); font-size:11px; letter-spacing:.22em; color:var(--gold); text-transform:uppercase; border-bottom:1px solid var(--line); display:flex; justify-content:space-between }
.cert .cbody{ padding:12px 18px 20px }
.cert .row{ display:flex; justify-content:space-between; align-items:baseline; padding:7px 0; border-bottom:1px dashed var(--line) }
.cert .row:last-child{ border-bottom:0 }
.cert .row .k{ font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--muted); text-transform:uppercase }
.cert .row .v{ font-size:15px; font-weight:700 } .cert .row .v.mono{ font-family:var(--mono); color:var(--scan) } .cert .row .v.ok{ color:var(--ok) }
.msgcard{ margin:16px 0 4px; border:1px solid var(--gold); border-radius:14px; padding:15px 16px; background:linear-gradient(180deg, rgba(233,185,73,.10), var(--void-2)); text-align:left }
.msgcard .rlabel{ font-family:var(--mono); font-size:10.5px; letter-spacing:.2em; color:var(--gold); text-transform:uppercase }
.msgtext{ font-size:15px; line-height:1.7; color:var(--ink); margin-top:9px; font-style:italic }
/* 섹션 헤더 */
.sect{ font-family:var(--mono); font-size:11px; letter-spacing:.2em; color:var(--muted); text-transform:uppercase; margin:22px 0 10px; text-align:left; display:flex; align-items:center; gap:8px }
.sect::before{ content:""; width:14px; height:1px; background:var(--line) } .sect::after{ content:""; flex:1; height:1px; background:var(--line) }
/* 랭킹 */
.board{ text-align:left; display:flex; flex-direction:column; gap:8px }
.board .r{ display:flex; align-items:center; gap:12px; padding:11px 13px; border:1px solid var(--line); border-radius:11px; background:var(--void-2) }
.board .r.me{ border-color:var(--gold); background:linear-gradient(90deg, rgba(233,185,73,.12), var(--void-2)) }
.board .rank{ font-family:var(--mono); font-weight:800; font-size:15px; color:var(--gold); width:26px; text-align:center; flex:0 0 auto }
.board .r.me .rank{ color:var(--gold) }
.board .nm{ flex:1; font-weight:700; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.board .nm small{ display:block; font-weight:500; color:var(--muted); font-size:11px; font-family:var(--mono) }
.board .sc{ font-family:var(--mono); font-weight:800; font-size:15px; color:var(--scan); flex:0 0 auto }
/* 축하 댓글창 */
.wall{ text-align:left; display:flex; flex-direction:column; gap:9px; max-height:230px; overflow-y:auto; padding-right:4px }
.wall .c{ border:1px solid var(--line); border-radius:11px; padding:11px 13px; background:var(--void-2); animation:fade .35s both }
.wall .c .top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px }
.wall .c .cn{ font-weight:700; font-size:13px; color:var(--gold) }
.wall .c .ct{ font-family:var(--mono); font-size:10px; color:var(--muted) }
.wall .c .cm{ font-size:14px; line-height:1.6; color:var(--ink) }
.wall .empty{ color:var(--muted); font-size:13px; text-align:center; padding:16px }
.shake{ animation:shake .4s }
@keyframes shake{ 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
.mt8{margin-top:8px} .mt14{margin-top:14px} .mt20{margin-top:20px} .mt24{margin-top:24px}
.foot{ font-family:var(--mono); font-size:10.5px; color:#3d4f74; text-align:center; margin-top:16px; letter-spacing:.06em; line-height:1.7 }
.fade{ animation:fade .45s ease both }
@keyframes fade{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
@media (max-width:420px){ h1{font-size:22px} .badge50{font-size:48px} .slot{font-size:21px} .pad{padding:24px 20px} }
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:width .1s linear !important} body::after{display:none} }
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script>
/* =========================================================================
   에스원 50주년 기록보관소 미션 (사내용 심화판)
   과거 5봉인(코드 1977★) + 미래 3인증 + 제한시간/봉인강화 페널티
   + 엔딩 등급(애사심) + 실시간 랭킹 + 축하 댓글창 + 스크린샷/공유
   ─────────────────────────────────────────────────────────────────────────
   [ 편집 ] STAGES(과거·digit) / FUTURE(미래) / STORY(대사) / BASE_TIME(제한초)
   [ 랭킹·댓글 ] Netlify Functions(/api/data)에 연결 시 모든 기기가 실시간 공유.
                서버 미연결(로컬 파일 등)이면 현재 세션 메모리로만 동작.
   ========================================================================= */

/* ── 저장소(랭킹·댓글) ──────────────────────────────────────────────
   Netlify Functions(/api/data)에 연결되면 접속한 모든 기기의 데이터가
   실시간으로 함께 모입니다(4초 간격 갱신). 서버 연결이 없으면(로컬에서 파일만
   열었을 때 등) 자동으로 현재 세션 메모리로만 동작합니다. */
const API = "/api/data";
const Store = {
  board:[], wall:[], online:false,
  async hydrate(){
    try{
      const r=await fetch(API,{cache:"no-store"});
      if(!r.ok) throw 0;
      const d=await r.json();
      if(Array.isArray(d.board)) Store.board=d.board;
      if(Array.isArray(d.wall))  Store.wall=d.wall;
      Store.online=true;
    }catch(e){ Store.online=false; }
  },
  async addScore(r){
    Store.board.push(r); Store.board.sort((a,b)=>b.score-a.score||a.seconds-b.seconds);
    try{
      const res=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({type:"score",rec:r})});
      if(res.ok){ const d=await res.json(); if(Array.isArray(d.board)) Store.board=d.board; if(Array.isArray(d.wall)) Store.wall=d.wall; if(typeof renderBoard==="function"&&document.getElementById("board")){renderBoard();renderWall();} }
    }catch(e){}
  },
  async addMsg(r){
    Store.wall.unshift(r);
    try{
      const res=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({type:"msg",rec:r})});
      if(res.ok){ const d=await res.json(); if(Array.isArray(d.board)) Store.board=d.board; if(Array.isArray(d.wall)) Store.wall=d.wall; if(typeof renderWall==="function"&&document.getElementById("wall")){renderBoard();renderWall();} }
    }catch(e){}
  }
};

function fmtTime(ms){ const t=Math.max(0,Math.floor(ms/1000)); return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"); }

function typeLine(el, text, done){
  if(reduce){ el.textContent=text; done&&done(); return ()=>{}; }
  el.textContent=""; el.classList.add("typing");
  let i=0, cancelled=false;
  const id=setInterval(()=>{
    if(cancelled) return;
    el.textContent=text.slice(0,++i);
    if(i>=text.length){ clearInterval(id); el.classList.remove("typing"); done&&done(); }
  }, 22);
  return ()=>{ if(cancelled) return; cancelled=true; clearInterval(id); el.textContent=text; el.classList.remove("typing"); };
}

  const feed=document.getElementById("feed"), ctl=document.getElementById("ctl");
  let idx=0, active=null;
  function showContinue(){ ctl.innerHTML = `<button class="btn btn-primary mt20" id="cont">${cta||"계속 ▶"}</button>`; document.getElementById("cont").onclick=onDone; }
  function addStatic(ln){ const w=document.createElement("div"); w.className="comms "+(ln.who==="SYS"?"sys":"blue");
    w.innerHTML=`<div class="who">${whoLabel(ln.who)}</div><div class="msg">${esc(fill(ln.text))}</div>`; feed.appendChild(w); feed.scrollTop=feed.scrollHeight; }
  function next(){ if(idx>=lines.length){ showContinue(); return; }
    const ln=lines[idx++]; const w=document.createElement("div"); w.className="comms "+(ln.who==="SYS"?"sys":"blue");
    w.innerHTML=`<div class="who">${whoLabel(ln.who)}</div><div class="msg"></div>`; feed.appendChild(w); feed.scrollTop=feed.scrollHeight;
    active=typeLine(w.querySelector(".msg"), fill(ln.text), ()=>{ active=null; setTimeout(next,300); }); }

  document.getElementById("skip").onclick=()=>{ if(active){active();active=null;} while(idx<lines.length){addStatic(lines[idx++]);} showContinue(); };
  next();
}

    <div class="progress ${past?"":"future"}">${dots}</div>
    <div class="pad" style="padding-top:12px">
      <div class="zone-tag ${past?"":"future"}">${esc(st.zone)}</div>
      <div class="comms blue"><div class="who">${whoLabel("BLUE")}</div><div class="msg" id="lead"></div></div>
      ${st.img?`<img class="qimg" src="${st.img}" alt="힌트 사진">${st.imgCap?`<div class="qimg-cap">${esc(st.imgCap)}</div>`:""}`:""}
      <div class="qtimer"><div class="track"><div class="bar" id="qbar"></div></div><div class="sec" id="qsec">${effTime()}s</div></div>
      <div class="q">${esc(st.q)}</div>
      <div class="opts pending" id="opts">${opts}</div>
      <div class="feedback" id="fb" role="status"></div>
      <div id="after"></div>
    </div>
    ${past?codebarHTML():""}
  </div>`;

  const optsEl=document.getElementById("opts");
  const reveal=()=>{ optsEl.classList.remove("pending"); startQTimer(mode); };
  const skip=typeLine(document.getElementById("lead"), fill(st.intro), reveal);
  document.querySelector(".comms.blue").onclick=()=>{ skip(); reveal(); };
  setTimeout(reveal, 4500);
  optsEl.querySelectorAll(".opt").forEach(b=> b.onclick=()=>answer(mode, parseInt(b.dataset.i)));
}

function startQTimer(mode){
  clearQTimer();
  const dur=effTime()*1000; let remain=dur;
  const bar=document.getElementById("qbar"), sec=document.getElementById("qsec");
  if(bar){ bar.style.width="100%"; }
  qClock=setInterval(()=>{
    remain-=100;
    const pct=Math.max(0, remain/dur)*100;
    if(bar){ bar.style.width=pct+"%";
      bar.style.background = pct>50 ? "var(--ok)" : pct>22 ? "var(--gold)" : "var(--danger)"; }
    if(sec) sec.textContent=Math.max(0,Math.ceil(remain/1000))+"s";
    if(remain<=0){ clearQTimer(); onTimeout(mode); }
  },100);
}

function bumpPenalty(){
  S.wrong++;
  const nl=Math.floor(S.wrong/3);
  if(nl>S.level){ S.level=nl; flashAlarm(); const el=document.querySelector(".hud .right");
    if(el && !el.querySelector(".lv")){ const s=document.createElement("span"); s.className="lv"; el.insertBefore(s, el.firstChild); }
    const lvEl=document.querySelector(".hud .lv"); if(lvEl) lvEl.textContent=`봉인강화 LV.${S.level}`; }
}
function flashAlarm(){
  const c=app.querySelector(".console"); if(!c) return;
  const a=document.createElement("div"); a.className="alarm";
  a.textContent=`⚠ 봉인 강화 — 보안등급 상승! 제한시간이 ${effTime()}초로 단축됩니다`;
  c.appendChild(a); setTimeout(()=>a.remove(), 2300);
}
function onTimeout(mode){
  const st=(mode==="past"?STAGES[S.pStage]:FUTURE[S.fStage]);
  bumpPenalty();
  const fb=document.getElementById("fb");
  if(fb) fb.innerHTML=`<span class="deny">⏱ 시간 초과 · 봉인이 반응합니다</span><span class="hint">안심등심 · 힌트 — ${esc(st.hint)}</span>`;
}

function codebarHTML(){
  const slots=STAGES.map((_,i)=>{ const d=S.digits[i]; return `<div class="slot ${d!==undefined?"filled":""}">${d!==undefined?d:"·"}</div>`; }).join("");
  return `<div class="codebar">
    <div class="clabel"><span>MASTER ACCESS CODE</span><span>${S.digits.filter(x=>x!==undefined).length} / ${STAGES.length}</span></div>
    <div class="slots">${slots}</div></div>`;
}

/* ── 정답 처리 ── */
function answer(mode, i){
  const past = mode==="past";
  const list = past ? STAGES : FUTURE;
  const idx  = past ? S.pStage : S.fStage;
  const st = list[idx];
  const buttons=[...app.querySelectorAll(".opt")];
  const fb=document.getElementById("fb");

  if(i===st.ans){
    clearQTimer();
    buttons.forEach(b=>{ b.disabled=true; if(+b.dataset.i===i) b.classList.add("correct"); });
    let gain="";
    if(past){ S.digits[idx]=st.digit; const cb=app.querySelector(".codebar"); if(cb) cb.outerHTML=codebarHTML();
      gain=`▶ 접근 승인 · 코드 [${st.digit}] 획득`; }
    else gain="▶ 인증 통과 · NEXT 50 통행증 스탬프 획득";
    fb.innerHTML=`<span style="color:var(--ok);font-family:var(--mono);font-weight:600">${gain}</span>`;
    const last = idx===list.length-1;
    document.getElementById("after").innerHTML=`
      <div class="comms blue fade" style="margin-top:14px"><div class="who">${whoLabel("BLUE")}</div><div class="msg">${esc(fill(st.react))}</div></div>
      <div class="record fade"><div class="rlabel">${past?"◈ 기록 확보":"◈ 미래 브리핑"}</div><div class="rtext">${esc(st.record)}</div>${st.recImg?`<img src="${st.recImg}" alt="">${st.recImgCap?`<div class="qimg-cap">${esc(st.recImgCap)}</div>`:""}`:""}</div>
      <button class="btn ${past?"btn-primary":"btn-gold"} mt20" id="next">${nextLabel(past,last)}</button>`;
    document.getElementById("next").onclick=()=> advance(past, idx, last);
  } else {
    bumpPenalty();
    const btn=buttons[i]; btn.classList.add("wrong");
    const card=app.querySelector(".console"); card.classList.add("shake");
    setTimeout(()=>{ card.classList.remove("shake"); btn.classList.remove("wrong"); },450);
    fb.innerHTML=`<span class="deny">✕ 접근 거부 · 코드 불일치</span><span class="hint">안심등심 · 힌트 — ${esc(st.hint)}</span>`;
  }
}
function nextLabel(past,last){ if(past) return last?"기록보관소 최종 해제 →":"다음 봉인으로 →"; return last?"미래 인증 완료 →":"다음 미래 인증 →"; }
function advance(past, idx, last){
  clearQTimer();
  if(past){ if(!last){ S.pStage++; renderStage("past"); } else renderTransmission(STORY.finale, renderArchiveReveal, "기록보관소 확인 →"); }
  else { if(!last){ S.fStage++; renderStage("future"); } else renderTransmission(STORY.futureOutro, renderCongrats, "축하 메시지 남기기 →"); }
}

/* ── 1막 완료 리빌 ── */
function renderArchiveReveal(){
  clearQTimer();
  app.innerHTML=`<div class="console fade"><div class="reveal">
    <div class="eyebrow center"><span class="dot"></span>ARCHIVE UNLOCKED · 과거 해제</div>
    <div class="badge50 mt14">1977<span style="color:var(--gold)">★</span></div>
    <div class="mono" style="color:var(--gold);letter-spacing:.3em;font-size:13px">— 50TH ANNIVERSARY —</div>
    <h1 class="mt14" style="font-size:23px">기록보관소가 열렸습니다</h1>
    <p class="lead">마스터코드 <b class="mono" style="color:var(--scan)">${MASTER}</b> 완성! —
      <b>1977년 창립</b>부터 올해로 <b>49년</b>. 그리고 내년, 마침내 <b style="color:var(--gold)">창립 50주년</b>입니다.<br>
      이제 이 회사의 <b style="color:var(--scan)">다음 50년</b>을 봉인 해제할 차례예요.</p>
    <img class="qimg" src="${IMG_SECOM}" alt="" style="max-height:230px;object-fit:cover;margin-top:18px"><div class="qimg-cap">50년을 지켜온 출동의 현장 · SECOM</div>
    <button class="btn btn-gold mt24" id="toFuture">미래 봉인 열기 · NEXT 50 →</button>
  </div></div>`;
  document.getElementById("toFuture").onclick=()=>
    renderTransmission(STORY.futureIntro, ()=>{ S.fStage=0; renderStage("future"); }, "미래 인증 시작 →");
}

/* ── 축하 메시지 ── */
function renderCongrats(){
  clearQTimer();
  app.innerHTML=`<div class="console fade"><div class="pad">
    <div class="eyebrow gold"><span class="dot"></span>축하 메시지 · MESSAGE TO THE NEXT 50</div>
    <h1 style="font-size:22px">곧 다가올 50주년,<br>한마디 남겨주세요</h1>
    <p class="lead">남긴 축하글은 아래 <b style="color:var(--gold)">실시간 축하 벽</b>에 바로 올라가고, 인증서에도 새겨집니다.</p>
    <label class="field"><span class="cap">나의 축하 메시지</span>
      <textarea class="input area" id="msg" maxlength="100" placeholder="예) 늘 든든하게 지켜줘 고마워요. 앞으로의 50년도 함께할게요!"></textarea></label>
    <div class="counter"><span id="cc">0</span> / 100</div>
    <button class="btn btn-gold mt14" id="save">축하글 남기고 결과 확인 →</button>
    <button class="btn btn-ghost mt8" id="skip">메시지 없이 완료</button>
  </div></div>`;
  const ta=document.getElementById("msg"), cc=document.getElementById("cc");
  ta.oninput=()=> cc.textContent=ta.value.length; ta.focus();
  document.getElementById("save").onclick=()=>{
    S.message=ta.value.trim();
    if(S.message) Store.addMsg({ name:S.agent.name, msg:S.message, t:Date.now() });
    finalize();
  };
  document.getElementById("skip").onclick=()=>{ S.message=""; finalize(); };
}

/* ── 점수 확정 후 결과 ── */
function finalize(){
  if(S.timerId) clearInterval(S.timerId);
  const seconds=Math.round((Date.now()-S.startTime)/1000);
  const score=Math.max(0, 1200 - S.wrong*80 - seconds*2);
  const gr=gradeOf(S.wrong);
  S.myRec={ name:S.agent.name, dept:S.agent.dept, score, seconds, wrong:S.wrong, grade:gr.g, t:Date.now() };
  Store.addScore(S.myRec);
  renderComplete();
}

/* ── 최종 결과 : 등급 + 인증서 + 축하벽 + 랭킹 + 저장/공유 ── */
function renderComplete(){
  clearQTimer();
  const rec=S.myRec, gr=gradeOf(rec.wrong);
  const clear=fmtTime(rec.seconds*1000);
  const now=new Date();
  const stamp=`${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,"0")}.${String(now.getDate()).padStart(2,"0")}`;
  const msgBlock = S.message ? `<div class="msgcard"><div class="rlabel">나의 축하 메시지 · TO THE NEXT 50</div><div class="msgtext">“${esc(S.message)}”</div></div>` : "";

  app.innerHTML=`<div class="console fade"><div class="reveal">
    <div class="eyebrow center gold"><span class="dot"></span>MISSION COMPLETE</div>
    <div class="badge50 mt14">50</div>
    <div class="mono" style="color:var(--gold);letter-spacing:.3em;font-size:13px">— YEARS & NEXT 50 —</div>
    <h1 class="mt14" style="font-size:22px">임무를 완수했습니다</h1>
    <p class="lead">${esc(blueByGrade(rec.wrong))}</p>

    <div class="grade">
      <div class="g ${gr.cls}">${gr.g}</div>
      <div><div class="gt">${esc(gr.title)}</div><div class="gs">${esc(gr.sub)}</div></div>
    </div>

    <div class="cert">
      <div class="chead"><span>S1 CLEARANCE · 임무 완료 인증</span><span>NO.${1000+Math.floor(Math.random()*9000)}</span></div>
      <div class="cbody">
        <div class="row"><span class="k">Agent</span><span class="v">${esc(rec.name)}</span></div>
        ${rec.dept?`<div class="row"><span class="k">Dept</span><span class="v">${esc(rec.dept)}</span></div>`:""}
        <div class="row"><span class="k">Grade</span><span class="v" style="color:var(--gold)">${gr.g} · ${esc(gr.title)}</span></div>
        <div class="row"><span class="k">Score</span><span class="v mono">${rec.score}</span></div>
        <div class="row"><span class="k">Clear Time</span><span class="v mono">${clear}</span></div>
        <div class="row"><span class="k">오답</span><span class="v mono">${rec.wrong}회</span></div>
        <div class="row"><span class="k">Master Code</span><span class="v mono">${MASTER}</span></div>
        <div class="row"><span class="k">Date</span><span class="v mono">${stamp}</span></div>
      </div>
    </div>
    ${msgBlock}

    <div class="sect">실시간 랭킹 · LEADERBOARD</div>
    <div class="board" id="board"></div>

    <div class="sect">축하 벽 · LIVE WALL</div>
    <div class="wall" id="wall"></div>

    <button class="btn btn-gold mt20" id="save">📸 인증 이미지 저장</button>
    <button class="btn btn-primary mt8" id="share">공유하기</button>
    <button class="btn btn-ghost mt8" id="again">다음 사람 도전 (처음부터)</button>
    <div class="foot">접속한 모두의 랭킹·축하글이 실시간으로 함께 모입니다 🎉</div>
  </div></div>`;

  renderBoard(); renderWall();
  // 실시간 갱신(공유 저장소가 있을 때 다른 참가자 반영)
  clearWallPoll();
  S.wallPoll=setInterval(async ()=>{ await Store.hydrate(); if(document.getElementById("wall")){ renderBoard(); renderWall(); } else clearWallPoll(); }, 4000);

  document.getElementById("again").onclick=startStory;
  document.getElementById("save").onclick=()=> downloadCard();
  document.getElementById("share").onclick=()=> shareCard();
}

function isMe(r){ return S.myRec && r.t===S.myRec.t && r.name===S.myRec.name; }
function renderBoard(){
  const el=document.getElementById("board"); if(!el) return;
  const top=Store.board.slice(0,5);
  let rows=top.map((r,i)=>{
    const me = isMe(r);
    return `<div class="r ${me?"me":""}"><div class="rank">${i+1}</div>
      <div class="nm">${esc(r.name)}${me?" (나)":""}<small>${r.grade}급 · ${fmtTime(r.seconds*1000)} · 오답 ${r.wrong}</small></div>
      <div class="sc">${r.score}</div></div>`;
  }).join("");
  const myRank = S.myRec ? Store.board.findIndex(isMe)+1 : 0;
  if(S.myRec && myRank>5){
    rows += `<div class="r me"><div class="rank">${myRank}</div>
      <div class="nm">${esc(S.myRec.name)} (나)<small>${S.myRec.grade}급 · ${fmtTime(S.myRec.seconds*1000)} · 오답 ${S.myRec.wrong}</small></div>
      <div class="sc">${S.myRec.score}</div></div>`;
  }
  el.innerHTML = rows || `<div class="wall"><div class="empty">아직 기록이 없어요. 1등의 주인공이 되어보세요!</div></div>`;
}
function renderWall(){
  const el=document.getElementById("wall"); if(!el) return;
  if(!Store.wall.length){ el.innerHTML=`<div class="empty">첫 축하 메시지를 남겨보세요 💛</div>`; return; }
  el.innerHTML = Store.wall.slice(0,30).map(c=>{
    const d=new Date(c.t); const hh=String(d.getHours()).padStart(2,"0"), mm=String(d.getMinutes()).padStart(2,"0");
    return `<div class="c"><div class="top"><span class="cn">${esc(c.name)}</span><span class="ct">${hh}:${mm}</span></div><div class="cm">${esc(c.msg)}</div></div>`;
  }).join("");
}

/* ── 인증 이미지(캔버스) 생성 : SNS용 세로 카드 ── */
function buildCard(){
  const W=1080,H=1350, c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d"); const rec=S.myRec, gr=gradeOf(rec.wrong);
  // 배경
  const bg=x.createLinearGradient(0,0,0,H); bg.addColorStop(0,"#0C1220"); bg.addColorStop(1,"#080B14");
  x.fillStyle=bg; x.fillRect(0,0,W,H);
  // 골드 테두리
  x.strokeStyle="#E9B949"; x.lineWidth=6; roundRect(x,40,40,W-80,H-80,28); x.stroke();
  x.textAlign="center";
  x.fillStyle="#54D2FF"; x.font="600 34px 'JetBrains Mono', monospace";
  x.fillText("S1  ARCHIVE  MISSION", W/2, 150);
  // 50
  x.fillStyle="#E9B949"; x.font="800 220px 'JetBrains Mono', monospace"; x.fillText("50", W/2, 400);
  x.fillStyle="#F4D588"; x.font="600 30px 'JetBrains Mono', monospace"; x.fillText("50TH ANNIVERSARY  ·  1977★", W/2, 460);
  // 등급 원
  x.fillStyle= gr.g==="S"?"#E9B949":gr.g==="A"?"#2E8FE6":gr.g==="B"?"#5b6f92":"#E5533C";
  x.beginPath(); x.arc(W/2,600,90,0,Math.PI*2); x.fill();
  x.fillStyle="#0C1220"; x.font="800 90px 'JetBrains Mono', monospace"; x.fillText(gr.g, W/2, 632);
  x.fillStyle="#EAF1FF"; x.font="800 44px 'Pretendard', sans-serif"; x.fillText(gr.title, W/2, 740);
  // 이름
  x.fillStyle="#8397BC"; x.font="500 30px 'Pretendard', sans-serif"; x.fillText("AGENT", W/2, 820);
  x.fillStyle="#EAF1FF"; x.font="800 60px 'Pretendard', sans-serif";
  x.fillText(rec.name + (rec.dept?"  ·  "+rec.dept:""), W/2, 885);
  // 스탯
  x.font="600 40px 'JetBrains Mono', monospace"; x.fillStyle="#54D2FF";
  x.fillText(`SCORE ${rec.score}   TIME ${fmtTime(rec.seconds*1000)}   MISS ${rec.wrong}`, W/2, 985);
  // 메시지
  if(S.message){
    x.strokeStyle="#243450"; x.lineWidth=2; roundRect(x,120,1050,W-240,180,20); x.stroke();
    x.fillStyle="#E9B949"; x.font="600 24px 'JetBrains Mono', monospace"; x.textAlign="left"; x.fillText("MESSAGE TO THE NEXT 50", 150, 1095);
    x.fillStyle="#EAF1FF"; x.font="500 34px 'Pretendard', sans-serif";
    wrapText(x, "“"+S.message+"”", 150, 1145, W-300, 44);
    x.textAlign="center";
  } else {
    x.fillStyle="#8397BC"; x.font="500 30px 'Pretendard', sans-serif"; x.fillText("에스원 창립 50주년 · NEXT 50", W/2, 1130);
  }
  x.fillStyle="#3d4f74"; x.font="500 24px 'JetBrains Mono', monospace"; x.fillText("#에스원50주년  #NEXT50", W/2, 1270);
  return c;
}
function roundRect(x,rx,ry,w,h,r){ x.beginPath(); x.moveTo(rx+r,ry); x.arcTo(rx+w,ry,rx+w,ry+h,r); x.arcTo(rx+w,ry+h,rx,ry+h,r); x.arcTo(rx,ry+h,rx,ry,r); x.arcTo(rx,ry,rx+w,ry,r); x.closePath(); }
function wrapText(x,t,rx,ry,maxW,lh){ const words=t.split(""); let line=""; let y=ry;
  for(const ch of words){ const test=line+ch; if(x.measureText(test).width>maxW && line){ x.fillText(line,rx,y); line=ch; y+=lh; } else line=test; }
  if(line) x.fillText(line,rx,y); }
function cardBlob(){ return new Promise(res=>{ try{ buildCard().toBlob(b=>res(b),"image/png"); }catch(e){ res(null); } }); }
async function downloadCard(){
  const btn=document.getElementById("save");
  try{ const blob=await cardBlob(); if(!blob) throw 0;
    const url=URL.createObjectURL(blob); const a=document.createElement("a");
    a.href=url; a.download=`에스원50주년_${S.myRec.name}.png`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
    if(btn){ btn.textContent="✓ 저장됨 (갤러리·다운로드 확인)"; setTimeout(()=>btn.textContent="📸 인증 이미지 저장",2200); }
  }catch(e){ if(btn) btn.textContent="이미지 저장 미지원 — 화면 캡처를 이용하세요"; }
}
async function shareCard(){
  const btn=document.getElementById("share");
  const text=`에스원 50주년 미션 클리어! ${S.myRec.name} · ${gradeOf(S.myRec.wrong).title} · ${S.myRec.score}점`+(S.message?`\n"${S.message}"`:"")+` #에스원50주년 #NEXT50`;
  try{
    const blob=await cardBlob();
    if(blob && navigator.canShare){
      const file=new File([blob],"s1-50th.png",{type:"image/png"});
      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file], text}); return; }
    }
    if(navigator.share){ await navigator.share({text}); return; }
    await navigator.clipboard.writeText(text);
    if(btn){ btn.textContent="✓ 공유 문구 복사됨"; setTimeout(()=>btn.textContent="공유하기",1800); }
    downloadCard();
  }catch(e){
    try{ await navigator.clipboard.writeText(text); if(btn){ btn.textContent="✓ 공유 문구 복사됨"; setTimeout(()=>btn.textContent="공유하기",1800);} }catch(_){}
  }
}

renderBoot();
</script>
